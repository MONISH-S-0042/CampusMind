<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusMind</title>
  <style>
    /* ============ Design tokens ============ */
    :root {
      --ink: #12151d;
      /* app background — deep ink navy */
      --surface: #1b2029;
      /* cards / AI bubble */
      --surface-2: #232a36;
      /* input bar, hover states */
      --line: #2b3342;
      /* hairline borders */
      --amber: #e5a13a;
      /* accent — desk-lamp amber */
      --amber-soft: #e5a13a22;
      --blue: #3f6ea6;
      /* user bubble — chalkboard blue */
      --text: #eae7dd;
      /* warm paper white */
      --text-dim: #8b93a3;
      --danger: #c2554b;
      --radius: 14px;
      --serif: "Fraunces", Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    }

    @font-face {
      /* Fraunces via Google Fonts — falls back silently to the serif stack above if offline */
      font-family: "Fraunces";
      src: local("Fraunces");
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--ink);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a,
    button,
    input,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    ::selection {
      background: var(--amber-soft);
    }

    /* Visible keyboard focus everywhere */
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }

    /* ============ Auth screen ============ */
    .auth-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 36px 32px 32px;
    }

    .auth-mark {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 4px;
      color: var(--text);
    }

    .auth-mark span {
      color: var(--amber);
    }

    .auth-sub {
      margin: 0 0 28px;
      color: var(--text-dim);
      font-size: 14px;
      line-height: 1.5;
    }

    /* Google sign-in button — light surface so the multicolour "G" stays legible */
    .btn-google {
      width: 100%;
      background: #f6f5f1;
      color: #1f2430;
      border: 1px solid #f6f5f1;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: filter .15s ease, border-color .15s ease;
    }

    .btn-google:hover {
      filter: brightness(0.96);
    }

    .btn-google:disabled {
      opacity: .65;
      cursor: default;
    }

    .btn-google svg {
      flex-shrink: 0;
    }

    .form-error {
      background: #c2554b1a;
      border: 1px solid #c2554b55;
      color: #e6a39c;
      font-size: 13.5px;
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 16px;
      display: none;
    }

    .form-error.show {
      display: block;
    }

    /* ============ Chat screen ============ */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--ink);
    }

    .topbar-mark {
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 600;
      color: var(--text);
    }

    .topbar-mark span {
      color: var(--amber);
    }

    .logout-btn {
      background: none;
      border: 1px solid var(--line);
      color: var(--text-dim);
      border-radius: 8px;
      padding: 7px 13px;
      font-size: 13.5px;
      transition: border-color .15s ease, color .15s ease;
    }

    .logout-btn:hover {
      border-color: var(--text-dim);
      color: var(--text);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 26px 18px 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .messages-inner {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .row {
      display: flex;
    }

    .row.user {
      justify-content: flex-end;
    }

    .row.ai {
      justify-content: flex-start;
    }

    .msg-group {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }

    .msg-group.user {
      align-items: flex-end;
    }

    .msg-group.ai {
      align-items: flex-start;
    }

    .msg-time {
      font-size: 11px;
      color: var(--text-dim);
      margin: 4px 6px 0;
    }

    .bubble {
      padding: 11px 15px;
      border-radius: var(--radius);
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .bubble.user {
      background: var(--blue);
      color: #f2f5fa;
      border-bottom-right-radius: 4px;
    }

    .bubble.ai {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .bubble.system {
      background: transparent;
      border: 1px dashed var(--line);
      color: var(--text-dim);
      font-size: 13.5px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 14.5px;
      text-align: center;
      padding: 40px;
      max-width: 360px;
      margin: 0 auto;
    }

    /* Typing indicator */
    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 2px;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      animation: bounce 1.1s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: .5;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing-dots span {
        animation: none;
        opacity: .8;
      }
    }

    /* Composer */
    .composer {
      border-top: 1px solid var(--line);
      background: var(--ink);
      padding: 14px 18px 18px;
    }

    .composer-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px 8px 8px 16px;
    }

    .composer textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      max-height: 140px;
      padding: 8px 0;
    }

    .composer textarea:focus {
      outline: none;
    }

    .send-btn {
      background: var(--amber);
      color: #1a1406;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: filter .15s ease, opacity .15s ease;
    }

    .send-btn:hover {
      filter: brightness(1.06);
    }

    .send-btn:disabled {
      opacity: .4;
      cursor: default;
    }

    .hint {
      text-align: center;
      color: var(--text-dim);
      font-size: 11.5px;
      margin-top: 8px;
    }

    .loading-older {
      text-align: center;
      color: var(--text-dim);
      font-size: 12.5px;
      padding: 6px 0 4px;
    }

    /* Markdown content inside AI/system bubbles.
       Whitespace is collapsed on these bubbles (white-space: normal) so the raw "\n"
       characters marked puts between tags never render as extra blank lines. All spacing
       is then set explicitly here: exactly ONE blank line between top-level blocks
       (paragraphs, headings, lists, code, quotes, tables), tight lists inside. */
    .bubble {
      --block-gap: 23px;
      /* one line: 15px font x 1.55 line-height */
    }

    .bubble:not(.user) {
      white-space: normal;
    }

    .bubble :is(p, h1, h2, h3, h4, h5, h6, ul, ol, pre, blockquote, table, hr) {
      margin: 0;
    }

    .bubble>:not(:first-child) {
      margin-top: var(--block-gap);
    }

    .bubble p {
      line-height: 1.45;
    }

    .bubble h1,
    .bubble h2,
    .bubble h3,
    .bubble h4,
    .bubble h5,
    .bubble h6 {
      padding: 0;
      line-height: 1;
    }

    /* Lists: tight. Only the left indent is kept so bullets still line up. */
    .bubble ul,
    .bubble ol {
      padding: 0 0 0 22px;
    }

    .bubble li {
      margin: 0;
      padding: 0;
      line-height: 1.45;
    }

    /* Loose-list safety net: <p> wrappers or nested lists inside <li> add no gap. */
    .bubble li>p,
    .bubble li>p+p {
      margin: 0;
      padding: 0;
    }

    .bubble li>ul,
    .bubble li>ol {
      margin: 0;
      padding: 0 0 0 18px;
    }

    .bubble pre {
      overflow-x: auto;
    }

    .bubble strong {
      color: var(--text);
      font-weight: 700;
    }

    .bubble em {
      font-style: italic;
    }

    .bubble code {
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 1px 5px;
      font-size: 13px;
    }

    .bubble a {
      color: var(--amber);
    }

    .hidden {
      display: none !important;
    }

    /* small screens */
    @media (max-width:480px) {
      .msg-group {
        max-width: 88%;
      }

      .topbar {
        padding: 12px 16px;
      }

      .messages {
        padding: 18px 12px 6px;
      }

      .composer {
        padding: 10px 12px 14px;
      }
    }
  </style>
</head>

<body>

  <div id="app">

    <!-- ===== AUTH SCREEN ===== -->
    <div id="authView" class="auth-wrap">
      <div class="auth-card">
        <p class="auth-mark">Campus<span>Mind</span></p>
        <p class="auth-sub" id="authSub">Sign in with your Google account to pick up where you left off.</p>

        <div class="form-error" id="authError" role="alert"></div>

        <button type="button" class="btn-google" id="googleBtn">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
          </svg>
          <span id="googleBtnLabel">Continue with Google</span>
        </button>
      </div>
    </div>

    <!-- ===== CHAT SCREEN ===== -->
    <div id="chatView" class="hidden" style="flex:1; display:flex; flex-direction:column; min-height:0;">
      <div class="topbar">
        <span class="topbar-mark">Campus<span>Mind</span></span>
        <button class="logout-btn" id="logoutBtn">Log out</button>
      </div>

      <div class="messages" id="messages">
        <div class="messages-inner" id="messagesInner"></div>
      </div>

      <div class="composer">
        <div class="composer-inner">
          <textarea id="composerInput" rows="1"
            placeholder="Ask about reminders, VIT rules, or anything else…"></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Send message">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 12L20 4L14 20L11 13L4 12Z" fill="currentColor" />
            </svg>
          </button>
        </div>
        <p class="hint">Enter to send · Shift + Enter for a new line</p>
      </div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
  <script>
    (() => {
      // ============ CONFIGURE THIS ============
      // Point this at wherever your FastAPI backend actually runs.
      const API_BASE = "http://localhost:8000";
      // The GET route that starts the Google flow (your `/login` route that calls
      // oauth.google.authorize_redirect). Adjust if your router prefix differs.
      const GOOGLE_LOGIN_PATH = "/api/auth/login";
      const PAGE_SIZE = 30; // how many messages to load per page
      // =========================================

      if (window.marked) marked.setOptions({ breaks: true }); // single \n → <br>, matching backend text

      const $ = (id) => document.getElementById(id);

      // Makes spacing identical no matter how many blank lines the server sends:
      // any run of blank lines (including ones holding only spaces) becomes exactly one
      // blank line, and leading/trailing blank space is dropped. Fenced code blocks are
      // left untouched, and everything else (lists, bold, links...) is plain markdown that
      // marked still parses as before.
      function normalizeSpacing(text) {
        const clean = (chunk) => chunk
          .replace(/\r\n?/g, "\n")
          .replace(/[ \t\u00a0]+\n/g, "\n")  // trailing spaces / whitespace-only lines
          .replace(/\n{3,}/g, "\n\n");        // 2+ blank lines -> exactly one
        return text
          .split(/(```[\s\S]*?```)/g)
          .map((part, i) => (i % 2 ? part : clean(part)))
          .join("")
          .replace(/^\s+|\s+$/g, "");
      }

      // Collapses blank lines that sit *inside* a markdown list (between bullet
      // items, or between a bullet and its sub-bullets) so `marked` treats the
      // list as "tight" instead of "loose". A loose list wraps every <li>'s
      // content in its own <p>, and those wrapped <p> tags stacking against
      // nested <ul> margins is what produces the big unwanted gaps between
      // bullets. This only removes blank lines that sit between two list-like
      // lines — blank lines between genuine paragraphs are left alone.
      function tightenListMarkdown(text) {
        if (!text) return text;
        text = normalizeSpacing(text);
        const lines = text.split("\n");
        const isListLine = (l) => /^\s*([-*+]|\d+[.)])\s+/.test(l);
        const isIndentedLine = (l) => /^\s{2,}\S/.test(l);
        const out = [];
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          if (line.trim() === "") {
            const prev = out[out.length - 1] || "";
            let j = i;
            while (j < lines.length && lines[j].trim() === "") j++;
            const next = lines[j] || "";
            const prevIsListy = isListLine(prev) || isIndentedLine(prev);
            const nextIsListy = isListLine(next) || isIndentedLine(next);
            if (prevIsListy && nextIsListy) {
              continue; // drop this blank line — keeps the list "tight"
            }
          }
          out.push(line);
        }
        return out.join("\n");
      }

      // ---- storage helpers ----
      const store = {
        get token() { return localStorage.getItem("cm_token"); },
        set token(v) { v ? localStorage.setItem("cm_token", v) : localStorage.removeItem("cm_token"); },
        get chatId() { return localStorage.getItem("cm_chat_id"); },
        set chatId(v) { v ? localStorage.setItem("cm_chat_id", v) : localStorage.removeItem("cm_chat_id"); },
        get userId() { return localStorage.getItem("cm_user_id"); },
        set userId(v) { v ? localStorage.setItem("cm_user_id", v) : localStorage.removeItem("cm_user_id"); },
        clear() { this.token = null; this.chatId = null; this.userId = null; }
      };

      // ---- API layer ----
      async function api(path, { method = "GET", auth = false, query = null } = {}) {
        let url = API_BASE + path;
        if (query) {
          const qs = new URLSearchParams(query).toString();
          url += (url.includes("?") ? "&" : "?") + qs;
        }
        const headers = {};
        if (auth) {
          if (!store.token) throw { unauthorized: true };
          headers["Authorization"] = "Bearer " + store.token;
        }
        const res = await fetch(url, { method, headers });
        let data = null;
        try { data = await res.json(); } catch (_) { }
        if (res.status === 401) { throw { unauthorized: true, status: 401, data }; }
        if (!res.ok) throw { status: res.status, data };
        return data;
      }

      // Looks for a real message from the backend (detail / message / msg — different
      // endpoints in this API use different shapes) before falling back to a generic string.
      function extractErrorMessage(err, fallback = "Something went wrong. Try again") {
        const d = err && err.data;
        if (d) {
          if (typeof d.detail === "string") return d.detail;
          if (typeof d.message === "string") return d.message;
          if (typeof d.msg === "string") return d.msg;
        }
        return fallback;
      }

      function goToAuth() {
        store.clear();
        $("chatView").classList.add("hidden");
        $("authView").classList.remove("hidden");
        resetGoogleButton();
      }

      function goToChat() {
        $("authView").classList.add("hidden");
        $("chatView").classList.remove("hidden");
      }

      // ============ AUTH VIEW (Google sign-in) ============

      function showAuthError(msg) {
        $("authError").textContent = msg; // textContent: never interpret server/URL text as HTML
        $("authError").classList.add("show");
      }
      function hideAuthError() {
        $("authError").classList.remove("show");
      }

      function resetGoogleButton() {
        $("googleBtn").disabled = false;
        $("googleBtnLabel").textContent = "Continue with Google";
      }

      $("googleBtn").addEventListener("click", () => {
        hideAuthError();
        if (window.location.protocol === "file:") {
          showAuthError("Serve this page over http (for example: python -m http.server 5500) \u2014 the backend can't redirect back to a file:// page.");
          return;
        }
        $("googleBtn").disabled = true;
        $("googleBtnLabel").textContent = "Redirecting to Google\u2026";
        // Full-page navigation: Google needs a top-level redirect (not fetch/XHR), and the
        // OAuth state cookie lives on the API origin. The backend sends us back here with
        // the token in the URL fragment, which init() below picks up.
        window.location.href = API_BASE + GOOGLE_LOGIN_PATH;
      });

      // If the user hits "Back" from Google's page, the browser may restore this page
      // from cache with the button still stuck on "Redirecting…".
      window.addEventListener("pageshow", (e) => {
        if (e.persisted) resetGoogleButton();
      });

      // Opens (or resumes) the user's chat once we hold a valid token.
      async function startSession() {
        try {
          const openRes = await api("/api/chat/open", { method: "GET", auth: true });
          if (!openRes || !openRes.chat_id) throw { data: { detail: "Could not open a chat session." } };
          store.chatId = openRes.chat_id;
          store.userId = openRes.user_id;

          goToChat();
          await loadHistory();
        } catch (err) {
          goToAuth();
          showAuthError(err && err.unauthorized
            ? "Your session expired. Please sign in again."
            : extractErrorMessage(err, "Couldn't start your chat session. Please try again."));
        }
      }

      $("logoutBtn").addEventListener("click", () => {
        goToAuth();
        hideAuthError();
      });

      // ============ CHAT VIEW ============

      // pagination state for the currently-open chat
      let oldestLoadedId = null;
      let hasMoreOlder = false;
      let isLoadingOlder = false;

      function isUserRole(role) {
        return role === "User" || role === "user";
      }

      function formatTime(value) {
        const d = value ? new Date(value) : new Date();
        if (isNaN(d.getTime())) return "";

        const timePart = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

        const startOfDay = (dt) => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
        const today = startOfDay(new Date());
        const msgDay = startOfDay(d);
        const dayDiff = Math.round((today - msgDay) / 86400000);

        if (dayDiff === 0) return `Today, ${timePart}`;
        if (dayDiff === 1) return `Yesterday, ${timePart}`;
        if (dayDiff > 1 && dayDiff < 7) {
          // e.g. "Wed, 8:40 PM"
          const weekday = d.toLocaleDateString([], { weekday: "short" });
          return `${weekday}, ${timePart}`;
        }
        // older than a week — e.g. "Wed 16 Sep, 8:40 PM" (drop the year if it's this year)
        const sameYear = d.getFullYear() === today.getFullYear();
        const datePart = d.toLocaleDateString([], {
          weekday: "short",
          day: "numeric",
          month: "short",
          year: sameYear ? undefined : "numeric"
        });
        return `${datePart}, ${timePart}`;
      }

      function createBubbleRow(role, content, createdAt) {
        const kind = isUserRole(role) ? "user" : (role === "system" ? "system" : "ai");
        const sideClass = kind === "system" ? "ai" : kind;

        const row = document.createElement("div");
        row.className = "row " + sideClass;

        const group = document.createElement("div");
        group.className = "msg-group " + sideClass;

        const bubble = document.createElement("div");
        bubble.className = "bubble " + kind;

        if (kind === "user") {
          // the user's own typed text — render as plain text, no markdown reinterpretation
          bubble.textContent = content;
        } else if (window.marked && window.DOMPurify) {
          bubble.innerHTML = DOMPurify.sanitize(marked.parse(tightenListMarkdown(content || "")));
        } else {
          bubble.textContent = content; // graceful fallback if the CDN libraries failed to load
        }

        const time = document.createElement("span");
        time.className = "msg-time";
        time.textContent = formatTime(createdAt);

        group.appendChild(bubble);
        group.appendChild(time);
        row.appendChild(group);
        return row;
      }

      function renderBubble(role, content, createdAt) {
        const row = createBubbleRow(role, content, createdAt);
        $("messagesInner").appendChild(row);
        return row;
      }

      function typewriterReveal(bubbleEl, fullText, kind) {
        return new Promise(resolve => {
          const tokens = fullText.split(/(\s+)/); // keep whitespace so spacing/newlines survive
          const wordsPerTick = 2;
          const tickMs = 35;
          let i = 0;

          function renderPartial(text) {
            if (kind === "user") {
              bubbleEl.textContent = text;
            } else if (window.marked && window.DOMPurify) {
              bubbleEl.innerHTML = DOMPurify.sanitize(marked.parse(tightenListMarkdown(text)));
            } else {
              bubbleEl.textContent = text;
            }
          }

          const timer = setInterval(() => {
            i += wordsPerTick;
            renderPartial(tokens.slice(0, i).join(""));
            scrollToBottom();
            if (i >= tokens.length) {
              clearInterval(timer);
              renderPartial(fullText); // exact final content, formatting intact
              resolve();
            }
          }, tickMs);
        });
      }

      async function renderBubbleAnimated(role, content, createdAt) {
        const kind = isUserRole(role) ? "user" : (role === "system" ? "system" : "ai");
        const row = createBubbleRow(role, "", createdAt);
        $("messagesInner").appendChild(row);

        const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduceMotion) {
          const bubbleEl = row.querySelector(".bubble");
          if (window.marked && window.DOMPurify) bubbleEl.innerHTML = DOMPurify.sanitize(marked.parse(tightenListMarkdown(content || "")));
          else bubbleEl.textContent = content;
          scrollToBottom();
          return row;
        }

        await typewriterReveal(row.querySelector(".bubble"), content, kind);
        return row;
      }

      // Reveals text that's already been fully received, a few characters at a time,
      // to mimic a live-typed response — the text itself was never streamed, only the reveal is.
      function typeOutContent(bubbleEl, fullText, kind) {
        return new Promise((resolve) => {
          const chunkSize = 3;
          const intervalMs = 12;
          let i = 0;
          const timer = setInterval(() => {
            i = Math.min(i + chunkSize, fullText.length);
            const partial = fullText.slice(0, i);
            if (kind !== "user" && window.marked && window.DOMPurify) {
              bubbleEl.innerHTML = DOMPurify.sanitize(marked.parse(tightenListMarkdown(partial)));
            } else {
              bubbleEl.textContent = partial;
            }
            scrollToBottom();
            if (i >= fullText.length) {
              clearInterval(timer);
              resolve();
            }
          }, intervalMs);
        });
      }

      async function renderBubbleTyped(role, content, createdAt) {
        const row = createBubbleRow(role, "", createdAt);
        $("messagesInner").appendChild(row);
        const bubbleEl = row.querySelector(".bubble");
        const kind = isUserRole(role) ? "user" : (role === "system" ? "system" : "ai");
        await typeOutContent(bubbleEl, content || "", kind);
        return row;
      }

      function renderTypingBubble() {
        const row = document.createElement("div");
        row.className = "row ai";
        row.id = "typingRow";
        const bubble = document.createElement("div");
        bubble.className = "bubble ai";
        bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
        row.appendChild(bubble);
        $("messagesInner").appendChild(row);
        scrollToBottom();
      }

      function removeTypingBubble() {
        const row = $("typingRow");
        if (row) row.remove();
      }

      function scrollToBottom() {
        const el = $("messages");
        el.scrollTop = el.scrollHeight;
      }

      function showEmptyState() {
        $("messagesInner").innerHTML = "";
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "This is the start of your conversation. Ask about a course reminder, a VIT rule, or anything else.";
        $("messages").appendChild(empty);
      }

      async function loadHistory() {
        $("messagesInner").innerHTML = "";
        oldestLoadedId = null;
        hasMoreOlder = false;
        try {
          const res = await api(`/api/chat/${store.chatId}/messages`, {
            auth: true,
            query: { limit: PAGE_SIZE }
          });
          if (!res || !res.messages || res.messages.length === 0) {
            showEmptyState();
            return;
          }
          const existingEmpty = document.querySelector(".empty-state");
          if (existingEmpty) existingEmpty.remove();
          res.messages.forEach(m => renderBubble(m.role, m.content, m.created_at));
          oldestLoadedId = res.messages[0].id;
          hasMoreOlder = !!res.has_more;
          scrollToBottom();
        } catch (err) {
          if (err.unauthorized) { goToAuth(); return; }
          showEmptyState();
        }
      }

      async function loadOlderMessages() {
        if (!hasMoreOlder || isLoadingOlder || oldestLoadedId == null) return;
        isLoadingOlder = true;

        const container = $("messages");
        const inner = $("messagesInner");
        const indicator = document.createElement("div");
        indicator.className = "loading-older";
        indicator.textContent = "Loading earlier messages…";
        inner.insertBefore(indicator, inner.firstChild);

        try {
          const res = await api(`/api/chat/${store.chatId}/messages`, {
            auth: true,
            query: { limit: PAGE_SIZE, before_id: oldestLoadedId }
          });
          indicator.remove();

          if (!res || !res.messages || res.messages.length === 0) {
            hasMoreOlder = false;
            return;
          }

          // preserve scroll position: record height before inserting, restore the offset after
          const prevScrollHeight = container.scrollHeight;
          const prevScrollTop = container.scrollTop;

          const anchor = inner.firstChild; // insert every older row before whatever was first
          res.messages.forEach(m => {
            const row = createBubbleRow(m.role, m.content, m.created_at);
            inner.insertBefore(row, anchor);
          });

          container.scrollTop = container.scrollHeight - prevScrollHeight + prevScrollTop;

          oldestLoadedId = res.messages[0].id;
          hasMoreOlder = !!res.has_more;
        } catch (err) {
          indicator.remove();
          if (err.unauthorized) { goToAuth(); return; }
          // leave hasMoreOlder as-is so the user can retry by scrolling again
        } finally {
          isLoadingOlder = false;
        }
      }

      $("messages").addEventListener("scroll", () => {
        if ($("messages").scrollTop < 60) loadOlderMessages();
      });

      const textarea = $("composerInput");
      textarea.addEventListener("input", () => {
        textarea.style.height = "auto";
        textarea.style.height = Math.min(textarea.scrollHeight, 140) + "px";
      });
      textarea.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
      $("sendBtn").addEventListener("click", sendMessage);

      async function sendMessage() {
        const text = textarea.value.trim();
        if (!text) return;

        const existingEmpty = document.querySelector(".empty-state");
        if (existingEmpty) existingEmpty.remove();

        renderBubble("User", text);
        textarea.value = "";
        textarea.style.height = "auto";
        scrollToBottom();

        $("sendBtn").disabled = true;
        renderTypingBubble();

        try {
          const res = await api(`/api/chat/${store.chatId}/message`, {
            method: "POST",
            auth: true,
            query: { query: text }
          });
          removeTypingBubble();

          if (res && res.response) {
            await renderBubbleAnimated("AI", res.response);
          } else if (res && res.message) {
            await renderBubbleAnimated("system", res.message);
          } else {
            await renderBubbleAnimated("system", "No response received. Please try again.");
          }
          scrollToBottom();
        } catch (err) {
          removeTypingBubble();
          if (err.unauthorized) { goToAuth(); return; }
          await renderBubbleAnimated("system", "Couldn't reach the server. Please try again.");
          scrollToBottom();
        } finally {
          $("sendBtn").disabled = false;
        }
      }

      // ============ BOOTSTRAP ============
      (async function init() {
        // 1) Returning from Google: the backend redirects here with
        //    #access_token=... (success) or #error=... (failure) in the URL fragment.
        const params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        const returnedToken = params.get("access_token");
        const returnedError = params.get("error");

        if (returnedToken || returnedError) {
          // Scrub the fragment right away so the token never lingers in the address bar,
          // history entries, or a copy-pasted URL.
          history.replaceState(null, "", window.location.pathname + window.location.search);
        }

        if (returnedError) {
          goToAuth();
          showAuthError(returnedError.slice(0, 200));
          return;
        }

        if (returnedToken) {
          store.clear();
          store.token = returnedToken;
          await startSession();
          return;
        }

        // 2) Already signed in from an earlier visit.
        if (store.token && store.chatId) {
          goToChat();
          await loadHistory(); // sends you back to sign-in on a 401 (expired token)
          return;
        }
        if (store.token) {
          await startSession();
          return;
        }

        // 3) Not signed in.
        goToAuth();
      })();
    })();
  </script>

</body>

</html>
