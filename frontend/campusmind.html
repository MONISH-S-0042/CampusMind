<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusMind</title>
  <style>
    /* ============ Design tokens ============ */
    :root {
      --ink: #12151d;
      /* app background — deep ink navy */
      --surface: #1b2029;
      /* cards / AI bubble */
      --surface-2: #232a36;
      /* input bar, hover states */
      --line: #2b3342;
      /* hairline borders */
      --amber: #e5a13a;
      /* accent — desk-lamp amber */
      --amber-soft: #e5a13a22;
      --blue: #3f6ea6;
      /* user bubble — chalkboard blue */
      --text: #eae7dd;
      /* warm paper white */
      --text-dim: #8b93a3;
      --danger: #c2554b;
      --radius: 14px;
      --serif: "Fraunces", Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    }

    @font-face {
      /* Fraunces via Google Fonts — falls back silently to the serif stack above if offline */
      font-family: "Fraunces";
      src: local("Fraunces");
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--ink);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a,
    button,
    input,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    ::selection {
      background: var(--amber-soft);
    }

    /* Visible keyboard focus everywhere */
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }

    /* ============ Auth screen ============ */
    .auth-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 36px 32px 32px;
    }

    .auth-mark {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 4px;
      color: var(--text);
    }

    .auth-mark span {
      color: var(--amber);
    }

    .auth-sub {
      margin: 0 0 28px;
      color: var(--text-dim);
      font-size: 14px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 13px;
      color: var(--text);
      font-size: 15px;
    }

    .field input:focus-visible {
      border-color: var(--amber);
    }

    .btn-primary {
      width: 100%;
      background: var(--amber);
      color: #1a1406;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: filter .15s ease;
    }

    .btn-primary:hover {
      filter: brightness(1.06);
    }

    .btn-primary:disabled {
      opacity: .6;
      cursor: default;
    }

    .auth-switch {
      text-align: center;
      margin-top: 18px;
      font-size: 13.5px;
      color: var(--text-dim);
    }

    .auth-switch button {
      background: none;
      border: none;
      color: var(--amber);
      font-size: 13.5px;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .form-error {
      background: #c2554b1a;
      border: 1px solid #c2554b55;
      color: #e6a39c;
      font-size: 13.5px;
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 16px;
      display: none;
    }

    .form-error.show {
      display: block;
    }

    /* ============ Chat screen ============ */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--ink);
    }

    .topbar-mark {
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 600;
      color: var(--text);
    }

    .topbar-mark span {
      color: var(--amber);
    }

    .logout-btn {
      background: none;
      border: 1px solid var(--line);
      color: var(--text-dim);
      border-radius: 8px;
      padding: 7px 13px;
      font-size: 13.5px;
      transition: border-color .15s ease, color .15s ease;
    }

    .logout-btn:hover {
      border-color: var(--text-dim);
      color: var(--text);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 26px 18px 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .messages-inner {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .row {
      display: flex;
    }

    .row.user {
      justify-content: flex-end;
    }

    .row.ai {
      justify-content: flex-start;
    }

    .msg-group {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }

    .msg-group.user {
      align-items: flex-end;
    }

    .msg-group.ai {
      align-items: flex-start;
    }

    .msg-time {
      font-size: 11px;
      color: var(--text-dim);
      margin: 4px 6px 0;
    }

    .bubble {
      padding: 11px 15px;
      border-radius: var(--radius);
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .bubble.user {
      background: var(--blue);
      color: #f2f5fa;
      border-bottom-right-radius: 4px;
    }

    .bubble.ai {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .bubble.system {
      background: transparent;
      border: 1px dashed var(--line);
      color: var(--text-dim);
      font-size: 13.5px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 14.5px;
      text-align: center;
      padding: 40px;
      max-width: 360px;
      margin: 0 auto;
    }

    /* Typing indicator */
    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 2px;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      animation: bounce 1.1s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: .5;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing-dots span {
        animation: none;
        opacity: .8;
      }
    }

    /* Composer */
    .composer {
      border-top: 1px solid var(--line);
      background: var(--ink);
      padding: 14px 18px 18px;
    }

    .composer-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px 8px 8px 16px;
    }

    .composer textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      max-height: 140px;
      padding: 8px 0;
    }

    .composer textarea:focus {
      outline: none;
    }

    .send-btn {
      background: var(--amber);
      color: #1a1406;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: filter .15s ease, opacity .15s ease;
    }

    .send-btn:hover {
      filter: brightness(1.06);
    }

    .send-btn:disabled {
      opacity: .4;
      cursor: default;
    }

    .hint {
      text-align: center;
      color: var(--text-dim);
      font-size: 11.5px;
      margin-top: 8px;
    }

    .loading-older {
      text-align: center;
      color: var(--text-dim);
      font-size: 12.5px;
      padding: 6px 0 4px;
    }

    /* Markdown content inside AI/system bubbles */
    .bubble p {
      margin: 0;
      line-height: 1.45;
    }

    .bubble p+p {
      margin-top: 3px;
    }

    .bubble p:last-child {
      margin-bottom: 0;
    }

    /* Headings */
    .bubble h1,
    .bubble h2,
    .bubble h3,
    .bubble h4,
    .bubble h5,
    .bubble h6 {
      margin: 0;
      padding: 0;
      line-height: 1.4;
    }

    .bubble h1+p,
    .bubble h2+p,
    .bubble h3+p,
    .bubble h4+p,
    .bubble h5+p,
    .bubble h6+p {
      margin-top: 3px;
    }

    /* Lists */
    .bubble ul,
    .bubble ol {
      margin: 2px 0 3px;
      padding-left: 22px;
    }

    .bubble li {
      margin: 0;
      padding: 0;
      line-height: 1.45;
    }

    .bubble li+li {
      margin-top: 2px;
    }

    /* Paragraph immediately before a list */
    .bubble p+ul,
    .bubble p+ol {
      margin-top: 3px;
    }

    /* List immediately after a heading */
    .bubble h1+ul,
    .bubble h2+ul,
    .bubble h3+ul,
    .bubble h4+ul,
    .bubble h5+ul,
    .bubble h6+ul,
    .bubble h1+ol,
    .bubble h2+ol,
    .bubble h3+ol,
    .bubble h4+ol,
    .bubble h5+ol,
    .bubble h6+ol {
      margin-top: 3px;
    }

    .bubble strong {
      color: var(--text);
      font-weight: 700;
    }

    .bubble em {
      font-style: italic;
    }

    .bubble code {
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 1px 5px;
      font-size: 13px;
    }

    .bubble a {
      color: var(--amber);
    }

    .hidden {
      display: none !important;
    }

    /* small screens */
    @media (max-width:480px) {
      .msg-group {
        max-width: 88%;
      }

      .topbar {
        padding: 12px 16px;
      }

      .messages {
        padding: 18px 12px 6px;
      }

      .composer {
        padding: 10px 12px 14px;
      }
    }
  </style>
</head>

<body>

  <div id="app">

    <!-- ===== AUTH SCREEN ===== -->
    <div id="authView" class="auth-wrap">
      <div class="auth-card">
        <p class="auth-mark">Campus<span>Mind</span></p>
        <p class="auth-sub" id="authSub">Sign in to pick up where you left off.</p>

        <div class="form-error" id="authError"></div>

        <form id="authForm">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn-primary" id="authSubmit">
            <span id="authSubmitLabel">Sign in</span>
          </button>
        </form>

        <div class="auth-switch">
          <span id="switchPrompt">New here?</span>
          <button type="button" id="switchBtn">Create an account</button>
        </div>
      </div>
    </div>

    <!-- ===== CHAT SCREEN ===== -->
    <div id="chatView" class="hidden" style="flex:1; display:flex; flex-direction:column; min-height:0;">
      <div class="topbar">
        <span class="topbar-mark">Campus<span>Mind</span></span>
        <button class="logout-btn" id="logoutBtn">Log out</button>
      </div>

      <div class="messages" id="messages">
        <div class="messages-inner" id="messagesInner"></div>
      </div>

      <div class="composer">
        <div class="composer-inner">
          <textarea id="composerInput" rows="1"
            placeholder="Ask about reminders, VIT rules, or anything else…"></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Send message">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 12L20 4L14 20L11 13L4 12Z" fill="currentColor" />
            </svg>
          </button>
        </div>
        <p class="hint">Enter to send · Shift + Enter for a new line</p>
      </div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
  <script>
    (() => {
      // ============ CONFIGURE THIS ============
      // Point this at wherever your FastAPI backend actually runs.
      const API_BASE = "http://localhost:8000";
      const PAGE_SIZE = 30; // how many messages to load per page
      // =========================================

      if (window.marked) marked.setOptions({ breaks: true }); // single \n → <br>, matching backend text

      const $ = (id) => document.getElementById(id);

      // ---- storage helpers ----
      const store = {
        get token() { return localStorage.getItem("cm_token"); },
        set token(v) { v ? localStorage.setItem("cm_token", v) : localStorage.removeItem("cm_token"); },
        get chatId() { return localStorage.getItem("cm_chat_id"); },
        set chatId(v) { v ? localStorage.setItem("cm_chat_id", v) : localStorage.removeItem("cm_chat_id"); },
        get userId() { return localStorage.getItem("cm_user_id"); },
        set userId(v) { v ? localStorage.setItem("cm_user_id", v) : localStorage.removeItem("cm_user_id"); },
        clear() { this.token = null; this.chatId = null; this.userId = null; }
      };

      // ---- API layer ----
      async function api(path, { method = "GET", auth = false, query = null } = {}) {
        let url = API_BASE + path;
        if (query) {
          const qs = new URLSearchParams(query).toString();
          url += (url.includes("?") ? "&" : "?") + qs;
        }
        const headers = {};
        if (auth) {
          if (!store.token) throw { unauthorized: true };
          headers["Authorization"] = "Bearer " + store.token;
        }
        const res = await fetch(url, { method, headers });
        let data = null;
        try { data = await res.json(); } catch (_) { }
        if (res.status === 401) { throw { unauthorized: true, status: 401, data }; }
        if (!res.ok) throw { status: res.status, data };
        return data;
      }

      // Looks for a real message from the backend (detail / message / msg — different
      // endpoints in this API use different shapes) before falling back to a generic string.
      function extractErrorMessage(err, fallback = "Something went wrong. Try again") {
        const d = err && err.data;
        if (d) {
          if (typeof d.detail === "string") return d.detail;
          if (typeof d.message === "string") return d.message;
          if (typeof d.msg === "string") return d.msg;
        }
        return fallback;
      }

      function goToAuth() {
        store.clear();
        $("chatView").classList.add("hidden");
        $("authView").classList.remove("hidden");
      }

      function goToChat() {
        $("authView").classList.add("hidden");
        $("chatView").classList.remove("hidden");
      }

      // ============ AUTH VIEW ============
      let mode = "login"; // or "register"

      $("switchBtn").addEventListener("click", () => {
        mode = mode === "login" ? "register" : "login";
        $("authSubmitLabel").textContent = mode === "login" ? "Sign in" : "Create account";
        $("authSub").textContent = mode === "login"
          ? "Sign in to pick up where you left off."
          : "A few seconds and you're in.";
        $("switchPrompt").textContent = mode === "login" ? "New here?" : "Already have an account?";
        $("switchBtn").textContent = mode === "login" ? "Create an account" : "Sign in instead";
        hideAuthError();
      });

      function showAuthError(msg) {
        $("authError").textContent = msg;
        $("authError").classList.add("show");
      }
      function hideAuthError() {
        $("authError").classList.remove("show");
      }

      $("authForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        hideAuthError();
        const username = $("username").value.trim();
        const password = $("password").value;
        if (!username || !password) return;

        const submitBtn = $("authSubmit");
        submitBtn.disabled = true;
        const originalLabel = $("authSubmitLabel").textContent;
        $("authSubmitLabel").textContent = mode === "login" ? "Signing in…" : "Creating account…";

        try {
          if (mode === "register") {
            await api("/api/auth/register", { method: "POST", query: { username, password } });
            // auto-continue into login after successful registration
            mode = "login";
          }
          const loginRes = await api("/api/auth/login", { method: "POST", query: { username, password } });
          if (!loginRes || !loginRes.access_token) throw { data: { detail: "Login failed. Please try again." } };
          store.token = loginRes.access_token;

          const openRes = await api("/api/chat/open", { method: "GET", auth: true });
          if (!openRes || !openRes.chat_id) throw { data: { detail: "Could not open a chat session." } };
          store.chatId = openRes.chat_id;
          store.userId = openRes.user_id;

          goToChat();
          await loadHistory();
        } catch (err) {
          const detail = err?.data?.detail || (err?.status === 401
            ? "Invalid username or password."
            : "Something went wrong. Please try again.");
          showAuthError(detail);
        } finally {
          submitBtn.disabled = false;
          $("authSubmitLabel").textContent = originalLabel;
        }
      });

      $("logoutBtn").addEventListener("click", goToAuth);

      // ============ CHAT VIEW ============

      // pagination state for the currently-open chat
      let oldestLoadedId = null;
      let hasMoreOlder = false;
      let isLoadingOlder = false;

      function isUserRole(role) {
        return role === "User" || role === "user";
      }

      function formatTime(value) {
        const d = value ? new Date(value) : new Date();
        if (isNaN(d.getTime())) return "";
        return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      }

      function createBubbleRow(role, content, createdAt) {
        const kind = isUserRole(role) ? "user" : (role === "system" ? "system" : "ai");
        const sideClass = kind === "system" ? "ai" : kind;

        const row = document.createElement("div");
        row.className = "row " + sideClass;

        const group = document.createElement("div");
        group.className = "msg-group " + sideClass;

        const bubble = document.createElement("div");
        bubble.className = "bubble " + kind;

        if (kind === "user") {
          // the user's own typed text — render as plain text, no markdown reinterpretation
          bubble.textContent = content;
        } else if (window.marked && window.DOMPurify) {
          bubble.innerHTML = DOMPurify.sanitize(marked.parse(content || ""));
        } else {
          bubble.textContent = content; // graceful fallback if the CDN libraries failed to load
        }

        const time = document.createElement("span");
        time.className = "msg-time";
        time.textContent = formatTime(createdAt);

        group.appendChild(bubble);
        group.appendChild(time);
        row.appendChild(group);
        return row;
      }

      function renderBubble(role, content, createdAt) {
        const row = createBubbleRow(role, content, createdAt);
        $("messagesInner").appendChild(row);
        return row;
      }

      function typewriterReveal(bubbleEl, fullText, kind) {
        return new Promise(resolve => {
          const tokens = fullText.split(/(\s+)/); // keep whitespace so spacing/newlines survive
          const wordsPerTick = 2;
          const tickMs = 35;
          let i = 0;

          function renderPartial(text) {
            if (kind === "user") {
              bubbleEl.textContent = text;
            } else if (window.marked && window.DOMPurify) {
              bubbleEl.innerHTML = DOMPurify.sanitize(marked.parse(text));
            } else {
              bubbleEl.textContent = text;
            }
          }

          const timer = setInterval(() => {
            i += wordsPerTick;
            renderPartial(tokens.slice(0, i).join(""));
            scrollToBottom();
            if (i >= tokens.length) {
              clearInterval(timer);
              renderPartial(fullText); // exact final content, formatting intact
              resolve();
            }
          }, tickMs);
        });
      }

      async function renderBubbleAnimated(role, content, createdAt) {
        const kind = isUserRole(role) ? "user" : (role === "system" ? "system" : "ai");
        const row = createBubbleRow(role, "", createdAt);
        $("messagesInner").appendChild(row);

        const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduceMotion) {
          const bubbleEl = row.querySelector(".bubble");
          if (window.marked && window.DOMPurify) bubbleEl.innerHTML = DOMPurify.sanitize(marked.parse(content || ""));
          else bubbleEl.textContent = content;
          scrollToBottom();
          return row;
        }

        await typewriterReveal(row.querySelector(".bubble"), content, kind);
        return row;
      }

      // Reveals text that's already been fully received, a few characters at a time,
      // to mimic a live-typed response — the text itself was never streamed, only the reveal is.
      function typeOutContent(bubbleEl, fullText, kind) {
        return new Promise((resolve) => {
          const chunkSize = 3;
          const intervalMs = 12;
          let i = 0;
          const timer = setInterval(() => {
            i = Math.min(i + chunkSize, fullText.length);
            const partial = fullText.slice(0, i);
            if (kind !== "user" && window.marked && window.DOMPurify) {
              bubbleEl.innerHTML = DOMPurify.sanitize(marked.parse(partial));
            } else {
              bubbleEl.textContent = partial;
            }
            scrollToBottom();
            if (i >= fullText.length) {
              clearInterval(timer);
              resolve();
            }
          }, intervalMs);
        });
      }

      async function renderBubbleTyped(role, content, createdAt) {
        const row = createBubbleRow(role, "", createdAt);
        $("messagesInner").appendChild(row);
        const bubbleEl = row.querySelector(".bubble");
        const kind = isUserRole(role) ? "user" : (role === "system" ? "system" : "ai");
        await typeOutContent(bubbleEl, content || "", kind);
        return row;
      }

      function renderTypingBubble() {
        const row = document.createElement("div");
        row.className = "row ai";
        row.id = "typingRow";
        const bubble = document.createElement("div");
        bubble.className = "bubble ai";
        bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
        row.appendChild(bubble);
        $("messagesInner").appendChild(row);
        scrollToBottom();
      }

      function removeTypingBubble() {
        const row = $("typingRow");
        if (row) row.remove();
      }

      function scrollToBottom() {
        const el = $("messages");
        el.scrollTop = el.scrollHeight;
      }

      function showEmptyState() {
        $("messagesInner").innerHTML = "";
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "This is the start of your conversation. Ask about a course reminder, a VIT rule, or anything else.";
        $("messages").appendChild(empty);
      }

      async function loadHistory() {
        $("messagesInner").innerHTML = "";
        oldestLoadedId = null;
        hasMoreOlder = false;
        try {
          const res = await api(`/api/chat/${store.chatId}/messages`, {
            auth: true,
            query: { limit: PAGE_SIZE }
          });
          if (!res || !res.messages || res.messages.length === 0) {
            showEmptyState();
            return;
          }
          const existingEmpty = document.querySelector(".empty-state");
          if (existingEmpty) existingEmpty.remove();
          res.messages.forEach(m => renderBubble(m.role, m.content, m.created_at));
          oldestLoadedId = res.messages[0].id;
          hasMoreOlder = !!res.has_more;
          scrollToBottom();
        } catch (err) {
          if (err.unauthorized) { goToAuth(); return; }
          showEmptyState();
        }
      }

      async function loadOlderMessages() {
        if (!hasMoreOlder || isLoadingOlder || oldestLoadedId == null) return;
        isLoadingOlder = true;

        const container = $("messages");
        const inner = $("messagesInner");
        const indicator = document.createElement("div");
        indicator.className = "loading-older";
        indicator.textContent = "Loading earlier messages…";
        inner.insertBefore(indicator, inner.firstChild);

        try {
          const res = await api(`/api/chat/${store.chatId}/messages`, {
            auth: true,
            query: { limit: PAGE_SIZE, before_id: oldestLoadedId }
          });
          indicator.remove();

          if (!res || !res.messages || res.messages.length === 0) {
            hasMoreOlder = false;
            return;
          }

          // preserve scroll position: record height before inserting, restore the offset after
          const prevScrollHeight = container.scrollHeight;
          const prevScrollTop = container.scrollTop;

          const anchor = inner.firstChild; // insert every older row before whatever was first
          res.messages.forEach(m => {
            const row = createBubbleRow(m.role, m.content, m.created_at);
            inner.insertBefore(row, anchor);
          });

          container.scrollTop = container.scrollHeight - prevScrollHeight + prevScrollTop;

          oldestLoadedId = res.messages[0].id;
          hasMoreOlder = !!res.has_more;
        } catch (err) {
          indicator.remove();
          if (err.unauthorized) { goToAuth(); return; }
          // leave hasMoreOlder as-is so the user can retry by scrolling again
        } finally {
          isLoadingOlder = false;
        }
      }

      $("messages").addEventListener("scroll", () => {
        if ($("messages").scrollTop < 60) loadOlderMessages();
      });

      const textarea = $("composerInput");
      textarea.addEventListener("input", () => {
        textarea.style.height = "auto";
        textarea.style.height = Math.min(textarea.scrollHeight, 140) + "px";
      });
      textarea.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
      $("sendBtn").addEventListener("click", sendMessage);

      async function sendMessage() {
        const text = textarea.value.trim();
        if (!text) return;

        const existingEmpty = document.querySelector(".empty-state");
        if (existingEmpty) existingEmpty.remove();

        renderBubble("User", text);
        textarea.value = "";
        textarea.style.height = "auto";
        scrollToBottom();

        $("sendBtn").disabled = true;
        renderTypingBubble();

        try {
          const res = await api(`/api/chat/${store.chatId}/message`, {
            method: "POST",
            auth: true,
            query: { query: text }
          });
          removeTypingBubble();

          if (res && res.response) {
            await renderBubbleAnimated("AI", res.response);
          } else if (res && res.message) {
            await renderBubbleAnimated("system", res.message);
          } else {
            await renderBubbleAnimated("system", "No response received. Please try again.");
          }
          scrollToBottom();
        } catch (err) {
          removeTypingBubble();
          if (err.unauthorized) { goToAuth(); return; }
          await renderBubbleAnimated("system", "Couldn't reach the server. Please try again.");
          scrollToBottom();
        } finally {
          $("sendBtn").disabled = false;
        }
      }

      // ============ BOOTSTRAP ============
      (async function init() {
        if (store.token && store.chatId) {
          try {
            goToChat();
            await loadHistory();
            return;
          } catch (_) {
            goToAuth();
            return;
          }
        }
        goToAuth();
      })();
    })();
  </script>

</body>

</html>
